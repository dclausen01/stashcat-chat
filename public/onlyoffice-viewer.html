<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dokument ansehen — BBZ Chat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: system-ui, sans-serif; }
    #editor { width: 100%; height: 100%; }
    #loading {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
      background: #f5f5f5; color: #555; font-size: 1.1rem;
    }
    #error {
      display: none; align-items: center; justify-content: center;
      width: 100%; height: 100%;
      background: #fff5f5; color: #c00; font-size: 1rem;
      padding: 2rem; text-align: center;
    }
  </style>
</head>
<body>
  <div id="loading">Dokument wird geladen...</div>
  <div id="error"></div>
  <div id="editor"></div>

  <!-- Externe Datei statt Inline-Script: die CSP (script-src 'self') blockt
       Inline-Bloecke. Muss nach den Ziel-Divs stehen. -->
  <script src="/onlyoffice-viewer.js"></script>
</body>
</html>
